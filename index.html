<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhishek Mishra Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <h3 style="padding-left: 10px;">Wellcome To Mirsha Commnication</h3>


        <div  class="catagories" id="catagoriesone"></div>



        <div  id="catagoriesdata" class="catagoriesdata"></div>



        <div class="billdata" id="billdata">
            <div  class="ownerinformation">
                <h4 id="companyname" >Mishra Commnication</h4>
                <label id="gst" for=""></label>
                <label id="addresss" for=""></label>
                <label id="mobileno" for=""></label>
            </div>
            <table class="tabledata">
                <thead>
                    <tr>
                        <th>S.no</th>
                        <th>Product Name</th>
                        <th>Qty</th>
                        <th>Rate</th>
                        <th>MRP</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody class="additmes" id="additmes"></tbody>

            </table><br>
            <strong id="totalAmount"></strong>
        </div>
    </div>


    <div style="display: flex; justify-content: center; margin-top: 20px;position: fixed;bottom: 0;left: 0;width: 100%;background-color: #f1f1f1;padding: 10px;">
        <div id="showbill" class="showbill">Show Bill</div>
        <div id="share" class="share">Place Order</div>
    </div>

</body>
<script src="script.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</html>
