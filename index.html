<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhishek Mishra Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <h3 style="padding-left: 10px;">Wellcome To Mirsha Commnication</h3>
        <div  class="catagories" id="catagoriesone"></div>
        <h5 style="text-align: center;" id="productnumber"></h5>
        <div  id="catagoriesdata" class="catagoriesdata"></div>


        
        <div class="billdata" id="billdata">
            <span id="closebtn" class="closebtn">X</span>
            <h4>Rough Bill </h4>
            <div class="ownerinformation">
                <h4 id="companyname">Mishra Commnication</h4>
                <label id="gst" for=""></label>
                <label id="addresss" for=""></label>
                <label id="mobileno" for=""></label>
            </div>
            <table class="tabledata">
                <thead>
                    <tr>
                        <th>S.no</th>
                        <th>Product Name</th>
                        <th>Qty</th>
                        <th>Rate</th>
                        <th>MRP</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody class="additmes" id="additmes"></tbody>
            </table><br>
            <strong id="totalAmount"></strong>
        </div>
    </div>


    <div class="orderdiv">
        <div id="showbill" class="showbill gg"><img src="./images/showbill.png" alt="">


        </div> </br>
        <div id="share" class="share gg"><img src="./images/basket.png" alt=""></div>
    </div>


    <div class="pleasewait">Please Wait...</div>



    <div id="image-div" class="image-div">
        <span style="margin: 10px;" id="closebtn1" class="closebtn">X</span>
        <img id="imageproduct" width="90%" src="" alt="">
    </div>

</body>
<script src="script.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</html>
